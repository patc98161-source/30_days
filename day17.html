<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 17 — Before You, After You</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF3EC; --plum: #3D1F2B; --rose: #C87A88; --gold: #D9A94E; --blush: #F3DCE1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--cream); color: var(--plum);
    font-family: 'Work Sans', sans-serif; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; margin: 0 0 8px; font-size: 1.5rem; text-align: center; }
  p.sub { margin: 0 0 24px; opacity: 0.75; font-size: 0.88rem; text-align: center; line-height: 1.45; }
  .seal {
    position: fixed; top: 24px; right: 24px; width: 64px; height: 64px; border-radius: 50%;
    background: var(--gold); color: var(--cream); display: flex; align-items: center; justify-content: center;
    font-family: 'Caveat', cursive; font-size: 1.3rem; box-shadow: 0 4px 12px rgba(61,31,43,0.25);
    transform: rotate(-6deg); user-select: none;
  }
  .card {
    background: var(--blush); border-radius: 20px; padding: 32px; max-width: 460px; width: 100%;
    box-shadow: 0 8px 30px rgba(61,31,43,0.12); animation: rise 0.6s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  .items { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
  .item { background: var(--cream); border-radius: 14px; padding: 16px 18px; }
  .item .before {
    font-size: 0.85rem; opacity: 0.5; text-decoration: line-through; text-decoration-color: rgba(61,31,43,0.35);
    margin: 0 0 6px;
  }
  .item .after {
    font-family: 'Fraunces', serif; font-size: 1rem; color: var(--plum); margin: 0; line-height: 1.4;
  }
  .item .after .highlight { color: var(--rose); font-weight: 600; }

  .closing {
    text-align: center; padding-top: 4px; border-top: 1px solid rgba(61,31,43,0.1);
  }
  .closing p {
    font-family: 'Caveat', cursive; font-size: 1.3rem; line-height: 1.5; margin: 16px 0 0; color: var(--plum);
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
  }
</style>
</head>
<body>
  <div class="seal">Day 17</div>
  <div class="card">
    <h1>Before You, After You</h1>
    <p class="sub">the distance never changed this part</p>

    <div class="items" id="items"></div>

    <div class="closing">
      <p id="closingText">Distance took a lot of ordinary things off the table for us. It never once took this: I want you to have whatever you want, always, even from this far away.I lovee youu Kadduu😘🩷🩷</p>
    </div>
  </div>

<script>
 
  const items = [
    {
      before: "Happiness was something I found on my own, in random places.",
      after: "Now the easiest way to feel happy is just <span class=\"highlight\">seeing your face on a call.</span>"
    },
    {
      before: "Distance was just a word on a map.",
      after: "Now it's the thing I think about beating <span class=\"highlight\">every single day</span> until it isn't a thing anymore."
    },
    {
      before: "I didn't think much about what I wanted for someone else's life.",
      after: "Now I want you to have <span class=\"highlight\">everything you want</span> — even the things I'm not part of."
    },
    {
      before: "Patience wasn't really something I had to practice.",
      after: "Now I've learned it on purpose, <span class=\"highlight\">because you're worth waiting for</span> properly."
    },
    {
      before: "My plans were mostly just about me.",
      after: "Now most of my plans have <span class=\"highlight\">an \"us\" built into them</span>, even the far-off ones."
    },
  ];
  // -------------------------------------------------------------

  const itemsEl = document.getElementById('items');
  items.forEach(it => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `<p class="before">${it.before}</p><p class="after">${it.after}</p>`;
    itemsEl.appendChild(div);
  });
</script>
</body>
</html>
