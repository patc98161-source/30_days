<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 16 — Tell Me About Your Day</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF3EC; --plum: #3D1F2B; --rose: #C87A88; --gold: #D9A94E; --blush: #F3DCE1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--cream); color: var(--plum);
    font-family: 'Work Sans', sans-serif; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; margin: 0 0 8px; font-size: 1.5rem; text-align: center; }
  p.sub { margin: 0 0 20px; opacity: 0.75; font-size: 0.9rem; text-align: center; }
  .seal {
    position: fixed; top: 24px; right: 24px; width: 64px; height: 64px; border-radius: 50%;
    background: var(--gold); color: var(--cream); display: flex; align-items: center; justify-content: center;
    font-family: 'Caveat', cursive; font-size: 1.3rem; box-shadow: 0 4px 12px rgba(61,31,43,0.25);
    transform: rotate(-6deg); user-select: none;
  }
  .card {
    background: var(--blush); border-radius: 20px; padding: 32px; max-width: 420px; width: 100%;
    box-shadow: 0 8px 30px rgba(61,31,43,0.12); animation: rise 0.6s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  textarea {
    width: 100%; background: var(--cream); border: 1px solid transparent; border-radius: 12px;
    padding: 12px 14px; font-family: 'Work Sans', sans-serif; font-size: 0.9rem; color: var(--plum);
    resize: none; min-height: 90px; margin-bottom: 12px;
  }
  textarea:focus { outline: none; border-color: var(--rose); }
  textarea::placeholder { color: rgba(61,31,43,0.4); }

  button.send {
    display: block; width: 100%; background: var(--rose); color: var(--cream); border: none;
    padding: 12px; border-radius: 999px; font-family: 'Work Sans', sans-serif; font-weight: 500;
    font-size: 0.95rem; cursor: pointer;
  }
  button.send:hover { background: var(--plum); }

  .response {
    margin-top: 18px; background: var(--cream); border-radius: 14px; padding: 20px;
    display: none; text-align: center;
  }
  .response.show { display: block; animation: fadeIn 0.4s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .response p {
    font-family: 'Fraunces', serif; font-style: italic; font-size: 1.02rem; line-height: 1.6; margin: 0;
  }

  .sent-note {
    text-align: center; font-size: 0.72rem; opacity: 0.5; margin: 10px 0 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .response.show { animation: none; }
  }
</style>
</head>
<body>
  <div class="seal">Day 16</div>
  <div class="card">
    <h1>Tell Me About Your Day</h1>
    <p class="sub">a sentence or two is plenty</p>

    <textarea id="input" placeholder="Today was..."></textarea>
    <button class="send" id="sendBtn">Tell them</button>

    <div class="response" id="response"><p id="responseText"></p></div>
    <p class="sent-note" id="sentNote"></p>
  </div>

<script>

  const rules = [
    {
      keywords: ["tired", "exhausted", "sleepy", "drained", "no energy"],
      replies: [
        "Then today's done being hard now — go rest, actually rest, not the kind where you keep your phone on.",
        "Sounds like you gave more than you had today. Don't feel behind for needing to recover from that.",
      ]
    },
    {
      keywords: ["stressed", "anxious", "overwhelmed", "pressure", "deadline"],
      replies: [
        "Okay — one thing at a time, that's all today owes you. I'm proud of you for getting through it anyway.",
        "That sounds like a lot to carry. You don't have to have it all figured out tonight.",
      ]
    },
    {
      keywords: ["sad", "down", "upset", "cried", "hurt", "low"],
      replies: [
        "I'm sorry today was heavy. You don't need to explain it fully — just know I'm thinking of you right now.",
        "That's allowed. Not every day has to be okay. I'm here regardless of which kind today was.",
      ]
    },
    {
      keywords: ["good", "great", "amazing", "happy", "excited", "fun"],
      replies: [
        "I love that. Tell me more about it later — I want the whole story, not just the summary.",
        "That's exactly the kind of day you deserve more of. Hold onto that feeling for a second longer.",
      ]
    },
    {
      keywords: ["busy", "hectic", "packed", "no time", "rushed"],
      replies: [
        "Sounds like today didn't give you a second to breathe. Take one now, on me.",
        "Busy days pass fast and blur together — just don't let this one pass without a proper rest tonight.",
      ]
    },
    {
      keywords: ["bored", "boring", "nothing happened", "uneventful"],
      replies: [
        "A quiet day isn't a wasted one. Sometimes those are the ones you look back on fondly, oddly enough.",
        "Nothing happening is underrated. Not every day needs a plot.",
      ]
    },
  ];

  const fallbackReplies = [
    "Thanks for telling me. Whatever kind of day it was, I'm glad you shared it with me instead of no one.",
    "I hear you. However today went, you don't have to carry it alone tonight.",
  ];
 
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const response = document.getElementById('response');
  const responseText = document.getElementById('responseText');
  const sentNote = document.getElementById('sentNote');

 
  const FORMSPREE_URL = "https://formspree.io/f/mvzedpnl";


  async function sendToFormspree(message) {
    if (FORMSPREE_URL.includes("YOUR_FORM_ID")) {
      sentNote.textContent = "(not saved yet — Formspree isn't set up, see the code comment)";
      return;
    }
    try {
      const res = await fetch(FORMSPREE_URL, {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: new URLSearchParams({
          message: message,
          page: 'Day 16 — Tell Me About Your Day',
          date: new Date().toLocaleString(),
        })
      });
      sentNote.textContent = res.ok ? 'Saved — I\'ll read this later 🤍' : '(couldn\'t save this one, but I still read it just now)';
    } catch {
      sentNote.textContent = '(couldn\'t save this one — check your connection)';
    }
  }

  sendBtn.addEventListener('click', () => {
    const raw = input.value.trim();
    const text = raw.toLowerCase();
    if (!raw) return;

    let pool = fallbackReplies;
    for (const rule of rules) {
      if (rule.keywords.some(k => text.includes(k))) {
        pool = rule.replies;
        break;
      }
    }

    responseText.textContent = pool[Math.floor(Math.random() * pool.length)];
    response.classList.add('show');
    sentNote.textContent = 'saving...';
    sendToFormspree(raw);
  });
</script>
</body>
</html>
