<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You, Kaddu</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF3EC; --plum: #3D1F2B; --rose: #C87A88; --gold: #D9A94E; --blush: #F3DCE1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--cream); color: var(--plum);
    font-family: 'Work Sans', sans-serif; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .seal {
    position: fixed; top: 24px; right: 24px; width: 64px; height: 64px; border-radius: 50%;
    background: var(--gold); color: var(--cream); display: flex; align-items: center; justify-content: center;
    font-family: 'Caveat', cursive; font-size: 1.3rem; box-shadow: 0 4px 12px rgba(61,31,43,0.25);
    transform: rotate(-6deg); user-select: none; z-index: 5;
  }
  .card {
    background: var(--blush); border-radius: 20px; padding: 40px 32px; max-width: 480px; width: 100%;
    box-shadow: 0 8px 30px rgba(61,31,43,0.12); animation: rise 0.6s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  h1 { font-family: 'Fraunces', serif; font-weight: 600; margin: 0 0 6px; font-size: 1.6rem; text-align: center; }
  p.sub { margin: 0 0 28px; opacity: 0.65; font-size: 0.85rem; text-align: center; line-height: 1.4; }

  .entry { margin-bottom: 22px; animation: fadeIn 0.4s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .entry:last-child { margin-bottom: 0; }
  .goal-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
  .goal-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.5; margin-bottom: 4px; }
  .goal-text {
    font-family: 'Fraunces', serif; font-size: 1.12rem; line-height: 1.4; margin: 0; color: var(--plum); flex: 1;
  }
  .remove-btn {
    background: none; border: none; color: rgba(61,31,43,0.3); cursor: pointer; font-size: 1rem;
    padding: 0 2px; line-height: 1; flex-shrink: 0;
  }
  .remove-btn:hover { color: var(--plum); }

  .commitment {
    background: var(--cream); border-radius: 12px; padding: 12px 16px; display: flex; gap: 8px; align-items: flex-start;
  }
  .commitment .icon { color: var(--rose); font-size: 0.95rem; margin-top: 1px; flex-shrink: 0; }
  .commitment p {
    font-family: 'Caveat', cursive; font-size: 1.15rem; line-height: 1.4; margin: 0; color: var(--plum); opacity: 0.9;
  }

  .add-section { margin-top: 28px; padding-top: 24px; border-top: 1px solid rgba(61,31,43,0.1); }
  .add-label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.6; margin-bottom: 10px; }
  .add-row { display: flex; gap: 8px; }
  .add-row input {
    flex: 1; background: var(--cream); border: 1px solid transparent; border-radius: 10px;
    padding: 10px 14px; font-family: 'Work Sans', sans-serif; font-size: 0.9rem; color: var(--plum);
  }
  .add-row input:focus { outline: none; border-color: var(--rose); }
  .add-row input::placeholder { color: rgba(61,31,43,0.4); }
  .add-row button {
    background: var(--rose); color: var(--cream); border: none; border-radius: 10px;
    padding: 0 18px; font-size: 1.1rem; cursor: pointer;
  }
  .add-row button:hover { background: var(--plum); }

  .hint { font-size: 0.75rem; opacity: 0.5; text-align: center; margin: 14px 0 0; }

  .closing { text-align: center; margin-top: 28px; padding-top: 24px; border-top: 1px solid rgba(61,31,43,0.1); }
  .closing p {
    font-family: 'Caveat', cursive; font-size: 1.2rem; line-height: 1.5; margin: 0; opacity: 0.85;
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .entry { animation: none; }
  }
</style>
</head>
<body>
  <div class="seal">✦</div>
  <div class="card">
    <h1 id="pageTitle">For You, Kaddu</h1>
    <p class="sub">not about us — just about you. Type anything you want out of life below, big or small, and I'll answer it.</p>

    <div id="entries"></div>

    <div class="add-section">
      <div class="add-label">What do you want?</div>
      <div class="add-row">
        <input type="text" id="goalInput" placeholder="Type a goal or a want, then hit +">
        <button id="addBtn">+</button>
      </div>
     
    </div>

    <div class="closing">
      <p id="closingLine">Whatever you want out of this life, I want you to have it — and I want to be part of how you get there, I Lovee you Kadduu</p>
    </div>
  </div>

<script>

  const HER_NAME = "Kaddu";
  document.getElementById('pageTitle').textContent = `For You, ${HER_NAME}`;


 
  const starterEntries = [
    {
      goal: "The career you are working toward",
      commitment: "I'll be the person who listens to every part of it — the boring parts too — without needing it explained to make sense to me."
    },
    {
      goal: "The confidence to not shrink herself for other people",
      commitment: "I'll remind you, especially on the days she forgets it herself, that she was never the problem to begin with."
    },
  ];

 
  const commitmentPool = [
    "Whatever it takes on my end, I'm in — just tell me how to help and I will.",
    "I'll ask you about this one again later, not just today — I want to actually see it through with you.",
    "This matters because it matters to you, and that's reason enough for me.",
    "I don't need to fully understand it to fully support it. I've got you either way.",
    "I'll remind you of this one on the days you forget you're capable of it.",
    "Consider this me, quietly, permanently on your team for this.",
  ];
  // --------------------------------------------------------------------------

  const STORAGE_KEY = 'herDreamsMyCommitments_v1';
  const entriesEl = document.getElementById('entries');
  const goalInput = document.getElementById('goalInput');
  const addBtn = document.getElementById('addBtn');

  function loadCustomEntries() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch { return []; }
  }

  function saveCustomEntries(list) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch {}
  }

  let customEntries = loadCustomEntries();

  function renderEntry(entry, isCustom, index) {
    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = `
      <div class="goal-row">
        <div style="flex:1;">
          <p class="goal-label">What you want</p>
          <p class="goal-text">${entry.goal}</p>
        </div>
        ${isCustom ? '<button class="remove-btn" aria-label="Remove">✕</button>' : ''}
      </div>
      <div class="commitment">
        <span class="icon">✦</span>
        <p>${entry.commitment}</p>
      </div>
    `;
    if (isCustom) {
      div.querySelector('.remove-btn').addEventListener('click', () => {
        customEntries.splice(index, 1);
        saveCustomEntries(customEntries);
        render();
      });
    }
    return div;
  }

  function render() {
    entriesEl.innerHTML = '';
    starterEntries.forEach(e => entriesEl.appendChild(renderEntry(e, false)));
    customEntries.forEach((e, i) => entriesEl.appendChild(renderEntry(e, true, i)));
  }

  function addGoal() {
    const text = goalInput.value.trim();
    if (!text) return;
    const commitment = commitmentPool[Math.floor(Math.random() * commitmentPool.length)];
    customEntries.push({ goal: text, commitment });
    saveCustomEntries(customEntries);
    goalInput.value = '';
    render();
  }

  addBtn.addEventListener('click', addGoal);
  goalInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addGoal(); });

  render();
</script>
</body>
</html>
