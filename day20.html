<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 20 — Our Story So Far</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF3EC; --plum: #3D1F2B; --rose: #C87A88; --gold: #D9A94E; --blush: #F3DCE1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--cream); color: var(--plum);
    font-family: 'Work Sans', sans-serif; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; margin: 0 0 8px; font-size: 1.5rem; text-align: center; }
  p.sub { margin: 0 0 24px; opacity: 0.75; font-size: 0.88rem; text-align: center; }
  .seal {
    position: fixed; top: 24px; right: 24px; width: 64px; height: 64px; border-radius: 50%;
    background: var(--gold); color: var(--cream); display: flex; align-items: center; justify-content: center;
    font-family: 'Caveat', cursive; font-size: 1.3rem; box-shadow: 0 4px 12px rgba(61,31,43,0.25);
    transform: rotate(-6deg); user-select: none;
  }
  .card {
    background: var(--blush); border-radius: 20px; padding: 32px 28px; max-width: 460px; width: 100%;
    box-shadow: 0 8px 30px rgba(61,31,43,0.12); animation: rise 0.6s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  .timeline { position: relative; padding-left: 26px; }
  .timeline::before {
    content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px;
    background: rgba(61,31,43,0.15);
  }

  .entry { position: relative; padding-bottom: 26px; }
  .entry:last-child { padding-bottom: 0; }
  .entry::before {
    content: ''; position: absolute; left: -26px; top: 4px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--rose); border: 3px solid var(--blush); box-shadow: 0 0 0 1px var(--rose);
  }
  .entry .date { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.55; margin: 0 0 4px; }
  .entry .title { font-family: 'Fraunces', serif; font-size: 1.02rem; margin: 0 0 4px; }
  .entry .desc { font-size: 0.87rem; opacity: 0.75; line-height: 1.45; margin: 0; }

  .closing {
    margin-top: 24px; padding-top: 18px; border-top: 1px solid rgba(61,31,43,0.1); text-align: center;
  }
  .closing p { font-family: 'Caveat', cursive; font-size: 1.25rem; line-height: 1.5; margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
  }
</style>
</head>
<body>
  <div class="seal">Day 20</div>
  <div class="card">
    <h1>Our Story So Far</h1>
    <p class="sub">the real one, not the highlight reel</p>

    <div class="timeline" id="timeline"></div>

    <div class="closing">
      <p id="closingLine">And the story's still going — this is just the part we've written so far.</p>
    </div>
  </div>

<script>

  const timeline = [
    { date: "October, 2025", title: "Hlo", desc: "you decided ki life mai kuch tufani krte hai,And our journey begin" },
    { date: "November, 2025", title: "Just imagine", desc: "Sab kuch sapne ki tarah chl raha tha,Dono  figure out krne ki koshis kr rahe thee" },
    { date: "November, 2025", title: "Break through", desc: "Future ki tension,kaise hoga sb manage but eventually you choose me" },
    { date: "December, 2025", title: "Our actual Journey begin", desc: "We started knowing each other better,terko bhi ab actually pyar hit krna shuru ho gaya." },
    { date: "Feburary, 2026", title: "The calm after the storm", desc: "thode fuck ups hue,but eventually we figured it out.the expression on your face when you read that letter,Mtlb i love you kaddu" },
    { date: "Today", title: "Kaddu ka birthday aane wala h", desc: "Bohot wait kiya h kaddu tere birthday ka Kaddu(6 saal), Finally i can celebrate it with you. " },
  ];
  // ---------------------------------------------

  const timelineEl = document.getElementById('timeline');
  timeline.forEach(entry => {
    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = `
      <p class="date">${entry.date}</p>
      <p class="title">${entry.title}</p>
      <p class="desc">${entry.desc}</p>
    `;
    timelineEl.appendChild(div);
  });
</script>
</body>
</html>
